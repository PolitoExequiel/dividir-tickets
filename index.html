<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8ff"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.svg"><title>Dividir Tickets</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:auto;max-width:650px;padding:24px 16px 80px;background:linear-gradient(145deg,#fff,#f3edff);color:#24163d;font:16px system-ui}h1{font-size:36px;letter-spacing:-2px}section{background:#fff;border:1px solid #e9e0ff;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 8px 30px #6741ad0b}input,button,select{font:inherit;padding:12px;border:1px solid #ded3f5;border-radius:12px;max-width:100%;margin:4px 0}button{background:#7041d8;color:white;border:0;cursor:pointer}button:active{transform:scale(.98)}label{display:block}small{color:#75648c}.line{display:grid;grid-template-columns:2fr 1fr;gap:8px;border-bottom:1px solid #eee;padding:8px 0}.line input{width:100%}.line select{grid-column:1/-1;width:100%}#status{white-space:pre-wrap}#result{white-space:pre-wrap}input[type=file]{display:none}.upload{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload label{border:1px dashed #b6a0ed;border-radius:18px;padding:24px 8px;text-align:center;background:#faf7ff;cursor:pointer}.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}.chips button{background:#f0eafa;color:#513a79;padding:9px 12px}.chips button.on{background:#7041d8;color:white}.line{padding:16px 0}.line>button{justify-self:start;background:#f0eafa;color:#513a79}#scan,#save,#share{width:100%}#history article{border-top:1px solid #eee;padding:12px 0}#history pre{white-space:pre-wrap;font:inherit}label>input:not([type=file]),label>select{display:block;width:100%} </style><header><small>✦ CUENTAS COMPARTIDAS</small><h1>Dividir<span style="color:#7041d8"> Tickets</span></h1><p>Una foto. Cada uno paga lo suyo.</p></header><section><h2>1 · Tu ticket</h2><label>Contraseña de acceso<input id="pw" type="password" autocomplete="current-password"></label><div class="upload"><label>▧ Galería<input id="photo" type="file" accept="image/*"></label><label>◎ Cámara<input id="camera" type="file" accept="image/*" capture="environment"></label></div><img id="preview" hidden alt="Foto del ticket" style="width:100%;max-height:240px;object-fit:contain;margin-top:12px;border-radius:12px"><p id="selected" role="status"></p><button id="scan">Leer con IA</button><p id="status" role="status"></p><label>Comercio<input id="merchant"></label><label>Total impreso<input id="total" type="number" step=".01"></label></section><section><h2>2 · Personas y consumos</h2><label>Nombres separados por comas<input id="people" placeholder="Ana, Juan"></label><div id="items"></div><button id="add">+ Producto</button><p id="check"></p></section><section><h2>3 · Reparto</h2><label>Pagó<select id="payer"></select></label><button id="save">Guardar reparto</button><p id="result"></p><button id="share">Compartir por WhatsApp</button><h3>Saldos acumulados</h3><div id="balances"></div><h3>Tickets anteriores</h3><div id="history"></div><button id="clear">Borrar historial</button></section><script>
const $=id=>document.getElementById(id), names=()=>[...new Set($('people').value.split(',').map(x=>x.trim()).filter(Boolean))], money=n=>n.toLocaleString('es-AR',{style:'currency',currency:'ARS'});let history=JSON.parse(localStorage.getItem('tickets-history')||'[]'), report='';
function options(s,all){let old=s.value;s.replaceChildren();if(all)s.add(new Option('Entre todos','*'));names().forEach(n=>s.add(new Option(n,n)));if([...s.options].some(o=>o.value===old))s.value=old}
function chips(d){let s=d.children[2],ns=names();let selected=d.group===null?ns:d.group.filter(n=>ns.includes(n));s.replaceChildren();function btn(t,on,fn){let b=document.createElement('button');b.textContent=t;b.className=on?'on':'';b.onclick=fn;s.append(b)}btn('Todos',ns.length>0&&selected.length===ns.length,()=>{d.group=selected.length===ns.length?[]:null;chips(d)});ns.forEach(n=>btn(n,selected.includes(n),()=>{d.group=selected.includes(n)?selected.filter(x=>x!==n):[...selected,n];chips(d)}));let prev=d.previousElementSibling;if(prev)btn('Repetir anterior',false,()=>{d.group=prev.group===null?null:[...prev.group];chips(d)});let info=document.createElement('small');info.textContent=selected.length?money(Number(d.children[1].value)/selected.length)+' por persona':'Sin asignar';s.append(info)}
function refresh(){document.querySelectorAll('.line').forEach(chips);options($('payer'),false);check()}
function row(n='',a=''){let d=document.createElement('div');d.className='line';d.group=null;let x=document.createElement('input'),y=document.createElement('input'),s=document.createElement('div'),b=document.createElement('button');s.className='chips';x.placeholder='Producto';x.value=n;y.type='number';y.step='.01';y.placeholder='Importe';y.value=a;b.textContent='Eliminar';b.onclick=()=>{d.remove();refresh()};d.append(x,y,s,b);$('items').append(d);chips(d);y.oninput=()=>{chips(d);check()};check()}
function rows(){return [...document.querySelectorAll('.line')].map(d=>({name:d.children[0].value,amount:Number(d.children[1].value),who:d.group===null?names():d.group.filter(n=>names().includes(n))}))}
function check(){let sum=rows().reduce((a,b)=>a+Math.round(b.amount*100),0), diff=Math.round(Number($('total').value)*100)-sum;$('check').textContent='Suma: '+money(sum/100)+' · '+(diff===0?'Coincide con el total':'Diferencia: '+money(diff/100));return diff===0}
$('people').oninput=refresh;$('total').oninput=check;$('add').onclick=()=>row();
let selectedFile=null,previewURL=null;function selectPhoto(input,other){let f=input.files[0];if(!f)return;selectedFile=f;other.value='';if(previewURL)URL.revokeObjectURL(previewURL);previewURL=URL.createObjectURL(f);$('preview').hidden=false;$('preview').src=previewURL;$('selected').textContent='Foto seleccionada: '+f.name;$('status').textContent='Lista para leer con IA.';}$('preview').onerror=()=>{$('preview').hidden=true;};$('photo').onchange=()=>selectPhoto($('photo'),$('camera'));$('camera').onchange=()=>selectPhoto($('camera'),$('photo'));$('scan').onclick=async()=>{let f=selectedFile;if(!f){$('status').textContent='Primero seleccioná una foto.';return}if(!$('pw').value){$('status').textContent='Ingresá la contraseña de acceso.';return}$('scan').disabled=true;$('status').textContent='Interpretando foto…';try{let bm;try{bm=await createImageBitmap(f)}catch{bm=await new Promise((resolve,reject)=>{let img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('No se pudo abrir esta foto. Probá una captura de pantalla JPG o PNG.'));img.src=previewURL;})}let c=document.createElement('canvas'),scale=Math.min(1,2200/Math.max(bm.width,bm.height));c.width=bm.width*scale;c.height=bm.height*scale;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);let blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));if(!blob)throw Error('No se pudo preparar la foto.');let form=new FormData();form.append('photo',blob,'ticket.jpg');let r=await fetch('/api/read',{method:'POST',headers:{'X-App-Password':$('pw').value},body:form}),j=await r.json();if(!r.ok)throw Error(j.error);$('merchant').value=j.merchant||'';$('total').value=j.total??'';$('items').replaceChildren();(j.items||[]).forEach(i=>row((i.quantity||1)+' × '+i.name,i.amount??''));$('status').textContent='Revisá los importes. '+(j.warnings||[]).join(' ');check()}catch(e){$('status').textContent=e.message}finally{$('scan').disabled=false}};
$('save').onclick=()=>{let ns=names(),p=$('payer').value,rs=rows();if(!ns.length||!p||!rs.length||!check()||!$('total').value||rs.some(r=>!r.name||!Number.isFinite(r.amount)||r.amount<0||!r.who.length)){alert('Completá y revisá el ticket antes de guardar.');return}let shares=Object.fromEntries(ns.map(n=>[n,0]));rs.forEach(r=>{let cents=Math.round(r.amount*100),group=r.who;group.forEach((n,i)=>shares[n]+=Math.floor(cents/group.length)+(i<cents%group.length?1:0))});let balances=Object.fromEntries(ns.map(n=>[n,(n===p?Math.round(Number($('total').value)*100):0)-shares[n]]));report='*'+($('merchant').value||'Ticket')+'* — '+money(Number($('total').value))+'\nPagó: '+p+'\n\n*Consumos*\n'+ns.map(n=>n+': '+money(shares[n]/100)+'\n'+rs.filter(r=>r.who.includes(n)).map(r=>'  · '+r.name).join('\n')).join('\n')+'\n\n*Transferencias*\n'+ns.filter(n=>n!==p&&shares[n]>0).map(n=>n+' → '+p+': '+money(shares[n]/100)).join('\n');history.push({balances,report,date:new Date().toISOString()});localStorage.setItem('tickets-history',JSON.stringify(history));$('result').textContent=report;show()};
function show(){let hbox=$('history');hbox.replaceChildren();[...history].reverse().forEach(h=>{let a=document.createElement('article'),d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre'),b=document.createElement('button');s.textContent=(h.date?new Date(h.date).toLocaleDateString('es-AR')+' · ':'')+h.report.split('\n')[0].replaceAll('*','');p.textContent=h.report;b.textContent='Compartir';b.onclick=()=>location.href='https://wa.me/?text='+encodeURIComponent(h.report);d.append(s,p,b);a.append(d);hbox.append(a)});let b={};history.forEach(h=>Object.entries(h.balances).forEach(([n,v])=>b[n]=(b[n]||0)+v));$('balances').textContent=Object.entries(b).map(([n,v])=>n+': '+money(v/100)).join(' · ')}$('clear').onclick=()=>{if(confirm('¿Borrar historial local?')){history=[];localStorage.removeItem('tickets-history');show()}};$('share').onclick=()=>{if(report)location.href='https://wa.me/?text='+encodeURIComponent(report)};row();show();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></html>
