<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8ff"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.svg"><title>Dividir Tickets</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:auto;max-width:650px;padding:24px 16px 80px;background:linear-gradient(145deg,#fff,#f3edff);color:#24163d;font:16px system-ui}h1{font-size:36px;letter-spacing:-2px}section{background:#fff;border:1px solid #e9e0ff;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 8px 30px #6741ad0b}input,button,select{font:inherit;padding:12px;border:1px solid #ded3f5;border-radius:12px;max-width:100%;margin:4px 0}button{background:#7041d8;color:white;border:0;cursor:pointer}button:active{transform:scale(.98)}label{display:block}small{color:#75648c}.line{display:grid;grid-template-columns:2fr 1fr;gap:8px;border-bottom:1px solid #eee;padding:8px 0}.line input{width:100%}.line select{grid-column:1/-1;width:100%}#status{white-space:pre-wrap}#result{white-space:pre-wrap}input[type=file]{display:none}.upload{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload label{border:1px dashed #b6a0ed;border-radius:18px;padding:24px 8px;text-align:center;background:#faf7ff;cursor:pointer}.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}.chips button{background:#f0eafa;color:#513a79;padding:9px 12px}.chips button.on{background:#7041d8;color:white}.line{padding:16px 0}.line>button{justify-self:start;background:#f0eafa;color:#513a79}#scan,#save,#share{width:100%}#history article{border-top:1px solid #eee;padding:12px 0}#history pre{white-space:pre-wrap;font:inherit}label>input:not([type=file]),label>select{display:block;width:100%} .chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.chips button{min-height:46px;margin:0;overflow-wrap:anywhere}.chips small{grid-column:1/-1}.line{background:#faf8ff;border:1px solid #e9e0ff;border-radius:16px;padding:12px;margin:12px 0}.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}.actions button{background:#eee7fa;color:#513a79;padding:8px 10px;font-size:14px}.line input{min-width:0}#liveTotals{white-space:pre-wrap} body.dark{background:#171321;color:#eee7ff}body.dark section{background:#241d32;border-color:#423451}body.dark .line,body.dark .upload label{background:#30263f;border-color:#514366}body.dark input,body.dark select{background:#20192d;color:#fff;border-color:#625375}body.dark small{color:#c6b6df}body.dark .chips button:not(.on),body.dark .actions button{background:#49385f;color:#eee7ff}input.invalid{border:2px solid #dc3545!important;outline:2px solid #dc354533}#settings summary{cursor:pointer;font-weight:700}#merchantError{color:#d33;font-size:14px} </style><header><small>✦ CUENTAS COMPARTIDAS</small><h1>Dividir<span style="color:#7041d8"> Tickets</span></h1><p>Una foto. Cada uno paga lo suyo.</p></header><section id="settings"><details><summary>⚙ Ajustes</summary><label>Personas habituales<input id="fixedPeople" placeholder="Nombres separados por comas"></label><button id="applyPeople">Guardar y usar personas</button><label>Tema<select id="theme"><option value="light">Claro</option><option value="dark">Oscuro</option><option value="system">Automático</option></select></label><small>Los ajustes se guardan en este dispositivo.</small></details></section><section><h2>1 · Tu ticket</h2><label>Contraseña de acceso<input id="pw" type="password" autocomplete="current-password"></label><button id="verify">Verificar contraseña</button><p id="authstatus" role="status"></p><div class="upload"><label>▧ Galería<input id="photo" type="file" accept="image/*"></label><label>◎ Cámara<input id="camera" type="file" accept="image/*" capture="environment"></label></div><img id="preview" hidden alt="" style="display:none"><p id="selected" role="status"></p><button id="scan">Leer con IA</button><p id="status" role="status"></p><label>Comercio<input id="merchant" required aria-describedby="merchantError"><small id="merchantError" role="alert"></small></label><label>Total impreso<input id="total" type="number" step=".01"></label></section><section><h2>2 · Personas y consumos</h2><label>Nombres separados por comas<input id="people" placeholder="Ana, Juan"></label><div id="items"></div><button id="add">+ Producto</button><label>Propina ($)<input id="tip" type="number" min="0" step=".01" placeholder="0"></label><small>Se reparte en partes iguales entre las personas.</small><p id="check"></p><div id="liveTotals"></div></section><section><h2>3 · Reparto</h2><label>Pagó<select id="payer"></select></label><label>Medio de pago<select id="method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select></label><p id="result"></p><button id="share">Compartir por WhatsApp</button><button id="newTicket">Nuevo ticket</button><h3>Saldos acumulados</h3><div id="balances"></div><h3>Tickets anteriores</h3><div id="history"></div><button id="clear">Borrar historial</button></section><script>
const $=id=>document.getElementById(id), names=()=>[...new Set($('people').value.split(',').map(x=>x.trim()).filter(Boolean))], money=n=>n.toLocaleString('es-AR',{style:'currency',currency:'ARS'});let history=JSON.parse(localStorage.getItem('tickets-history')||'[]'), report='';
$('pw').oninput=()=>{$('authstatus').textContent=''};$('verify').onclick=async()=>{let p=$('pw').value;if(!p){$('authstatus').textContent='Ingresá la contraseña.';return}$('verify').disabled=true;$('authstatus').textContent='Verificando…';try{let r=await fetch('/api/auth',{method:'POST',headers:{'X-App-Password':p}}),j=await r.json();if($('pw').value===p){$('authstatus').textContent=r.ok?'✓ Contraseña correcta':j.error;$('authstatus').style.color=r.ok?'#187647':'#b42318'}}catch{$('authstatus').textContent='No se pudo conectar al servidor.'}finally{$('verify').disabled=false}};function options(s,all){let old=s.value;s.replaceChildren();if(all)s.add(new Option('Entre todos','*'));names().forEach(n=>s.add(new Option(n,n)));if([...s.options].some(o=>o.value===old))s.value=old}
function chips(d){let s=d.children[2],ns=names();let selected=d.group===null?ns:d.group.filter(n=>ns.includes(n));s.replaceChildren();function btn(t,on,fn){let b=document.createElement('button');b.textContent=t;b.className=on?'on':'';b.onclick=()=>{fn();check()};s.append(b)}btn('Todos',ns.length>0&&selected.length===ns.length,()=>{d.group=selected.length===ns.length?[]:null;chips(d)});ns.forEach(n=>btn(n,selected.includes(n),()=>{d.group=selected.includes(n)?selected.filter(x=>x!==n):[...selected,n];chips(d)}));let prev=d.previousElementSibling;if(prev)btn('Repetir anterior',false,()=>{d.group=prev.group===null?null:[...prev.group];chips(d)});let info=document.createElement('small');info.textContent=selected.length?selected.map((n,i)=>n+': '+money(part(Math.round(Number(d.children[1].value)*100),selected.length,i)/100)).join(' · '):'Sin asignar';s.append(info)}
function refresh(){document.querySelectorAll('.line').forEach(chips);options($('payer'),false);check()}
function row(n='',a='',after=null,group=[]){let d=document.createElement('div');d.className='line';d.group=group;let x=document.createElement('input'),y=document.createElement('input'),s=document.createElement('div'),b=document.createElement('button');s.className='chips';x.placeholder='Producto';x.value=n;y.type='number';y.step='.01';y.placeholder='Importe';y.value=a;let actions=document.createElement('div');actions.className='actions';function action(t,fn){let z=document.createElement('button');z.textContent=t;z.onclick=fn;actions.append(z)}action('↑',()=>{if(d.previousElementSibling)d.parentNode.insertBefore(d,d.previousElementSibling);refresh()});action('↓',()=>{if(d.nextElementSibling)d.parentNode.insertBefore(d.nextElementSibling,d);refresh()});action('+ Debajo',()=>row('','',d));action('Dividir importe',()=>{let total=Math.round(Number(y.value)*100),v=prompt('¿Qué importe querés separar?');if(v===null)return;let cents=Math.round(Number(v.replace(',','.'))*100);if(!Number.isFinite(cents)||cents<=0||cents>=total){alert('Ingresá un importe menor al total del producto.');return}y.value=(total-cents)/100;row(x.value+' (parte 2)',cents/100,d,[]);refresh()});action('Eliminar',()=>{d.remove();refresh()});d.append(x,y,s,actions);if(after)after.after(d);else $('items').append(d);chips(d);y.oninput=()=>{chips(d);check()};check()}
function rows(){return [...document.querySelectorAll('.line')].map(d=>({name:d.children[0].value,amount:Number(d.children[1].value),who:d.group===null?names():d.group.filter(n=>names().includes(n))}))}
function part(c,n,i){return Math.floor(c/n)+(i<c%n?1:0)}function allocation(rs,ns){let out=Object.fromEntries(ns.map(n=>[n,[]]));rs.forEach(r=>r.who.forEach((n,i)=>out[n].push({name:r.name,cents:part(Math.round(r.amount*100),r.who.length,i)})));return out}function tip(){return Math.round(Number($('tip').value||0)*100)}function withTip(rs,ns){return tip()>0?[...rs,{name:'Propina',amount:tip()/100,who:ns}]:rs}function check(){let sum=rows().reduce((a,b)=>a+Math.round(b.amount*100),0), diff=Math.round(Number($('total').value)*100)-sum;$('check').textContent='Suma: '+money(sum/100)+' · '+(diff===0?'Coincide con el total':'Diferencia: '+money(diff/100));let rs=rows(),ns=names(),a=allocation(withTip(rs,ns),ns);$('liveTotals').textContent=ns.map(n=>n+': '+money(a[n].reduce((s,r)=>s+r.cents,0)/100)).join('\n')+(rs.some(r=>!r.who.length&&r.amount)?'\nHay productos sin asignar.':'');return diff===0}
$('people').oninput=refresh;$('total').oninput=check;$('tip').oninput=check;$('add').onclick=()=>row();
let selectedFile=null,previewURL=null;function selectPhoto(input,other){let f=input.files[0];if(!f)return;selectedFile=f;other.value='';if(previewURL)URL.revokeObjectURL(previewURL);previewURL=URL.createObjectURL(f);$('preview').hidden=false;$('preview').src=previewURL;$('selected').textContent='✓ Foto lista';$('status').textContent='Lista para leer con IA.';}$('preview').onerror=()=>{$('preview').hidden=true;};$('photo').onchange=()=>selectPhoto($('photo'),$('camera'));$('camera').onchange=()=>selectPhoto($('camera'),$('photo'));$('scan').onclick=async()=>{let f=selectedFile;if(!f){$('status').textContent='Primero seleccioná una foto.';return}if(!$('pw').value){$('status').textContent='Ingresá la contraseña de acceso.';return}$('scan').disabled=true;$('status').textContent='Interpretando foto…';try{let bm;try{bm=await createImageBitmap(f)}catch{bm=await new Promise((resolve,reject)=>{let img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('No se pudo abrir esta foto. Probá una captura de pantalla JPG o PNG.'));img.src=previewURL;})}let c=document.createElement('canvas'),scale=Math.min(1,2200/Math.max(bm.width,bm.height));c.width=bm.width*scale;c.height=bm.height*scale;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);let blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));if(!blob)throw Error('No se pudo preparar la foto.');let form=new FormData();form.append('photo',blob,'ticket.jpg');let r=await fetch('/api/read',{method:'POST',headers:{'X-App-Password':$('pw').value},body:form}),j=await r.json();if(!r.ok)throw Error(j.error);draftId=null;$('tip').value='';$('merchant').value=cleanMerchant(j.merchant);$('merchant').classList.remove('invalid');$('merchantError').textContent='';$('total').value=j.total??'';$('items').replaceChildren();(j.items||[]).forEach(i=>row((i.quantity||1)+' × '+i.name,i.amount??''));$('status').textContent='Revisá los importes. '+(j.warnings||[]).join(' ');check()}catch(e){$('status').textContent=e.message}finally{$('scan').disabled=false}};
let draftId=null;function save(){if(!cleanMerchant($('merchant').value)){$('merchant').value='';$('merchant').classList.add('invalid');$('merchantError').textContent='Ingresá el nombre del comercio para compartir.';$('merchant').scrollIntoView({block:'center'});$('merchant').focus();return false;}let ns=names(),p=$('payer').value,rs=rows();if(!Number.isFinite(tip())||tip()<0||!ns.length||!p||!rs.length||!check()||!$('total').value||rs.some(r=>!r.name||!Number.isFinite(r.amount)||r.amount<0||!r.who.length)){alert('Completá y revisá el ticket antes de guardar.');return}let a=allocation(withTip(rs,ns),ns),shares=Object.fromEntries(ns.map(n=>[n,a[n].reduce((s,r)=>s+r.cents,0)]));let balances=Object.fromEntries(ns.map(n=>[n,(n===p?Math.round(Number($('total').value)*100)+tip():0)-shares[n]]));report='*'+($('merchant').value||'Ticket')+'* — '+money(Number($('total').value)+tip()/100)+(tip()>0?' (incluye propina '+money(tip()/100)+')':'')+'\nPagó: '+p+' · '+$('method').value+'\n\n*Consumos*\n'+ns.map(n=>n+': '+money(shares[n]/100)+'\n'+a[n].map(r=>'  · '+r.name+': '+money(r.cents/100)).join('\n')).join('\n')+'\n\n*Transferencias*\n'+ns.filter(n=>n!==p&&shares[n]>0).map(n=>n+' → '+p+': '+money(shares[n]/100)).join('\n');if(!draftId)draftId=crypto.randomUUID();let entry={id:draftId,balances,report,date:new Date().toISOString()},idx=history.findIndex(h=>h.id===draftId);if(idx<0)history.push(entry);else history[idx]=entry;localStorage.setItem('tickets-history',JSON.stringify(history));$('result').textContent=report;show();return true};
function show(){let hbox=$('history');hbox.replaceChildren();[...history].reverse().forEach(h=>{let a=document.createElement('article'),d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre'),b=document.createElement('button');s.textContent=(h.date?new Date(h.date).toLocaleDateString('es-AR')+' · ':'')+h.report.split('\n')[0].replaceAll('*','');p.textContent=h.report;b.textContent='Compartir';b.onclick=()=>location.href='https://wa.me/?text='+encodeURIComponent(h.report);d.append(s,p,b);a.append(d);hbox.append(a)});let b={};history.forEach(h=>Object.entries(h.balances).forEach(([n,v])=>b[n]=(b[n]||0)+v));$('balances').textContent=Object.entries(b).map(([n,v])=>n+': '+money(v/100)).join(' · ')}$('clear').onclick=()=>{if(confirm('¿Borrar historial local?')){history=[];localStorage.removeItem('tickets-history');show()}};$('share').onclick=()=>{if(save())location.href='https://wa.me/?text='+encodeURIComponent(report)};$('newTicket').onclick=()=>{if(confirm('¿Empezar otro ticket?')){draftId=null;report='';$('merchant').value='';$('total').value='';$('tip').value='';$('items').replaceChildren();$('result').textContent='';selectedFile=null;$('photo').value='';$('camera').value='';$('selected').textContent='';$('status').textContent='';row();refresh()}};function cleanMerchant(v){return typeof v==='string'&&!/^(null|undefined|none|n\/a)$/i.test(v.trim())?v.trim():''}const media=matchMedia('(prefers-color-scheme: dark)');function theme(){let t=$('theme').value;document.body.classList.toggle('dark',t==='dark'||(t==='system'&&media.matches))}$('theme').value=localStorage.getItem('tickets-theme')||'light';$('theme').onchange=()=>{localStorage.setItem('tickets-theme',$('theme').value);theme()};media.addEventListener?.('change',theme);theme();$('fixedPeople').value=localStorage.getItem('tickets-people')||'';$('people').value=$('fixedPeople').value;$('applyPeople').onclick=()=>{localStorage.setItem('tickets-people',$('fixedPeople').value);$('people').value=$('fixedPeople').value;refresh();$('settings').querySelector('details').open=false};$('merchant').oninput=()=>{if(cleanMerchant($('merchant').value)){$('merchant').classList.remove('invalid');$('merchantError').textContent=''}};row();refresh();show();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></html>
